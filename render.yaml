services:
  - type: web
    name: lendsqr-wallet-service
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm build
    startCommand: pnpm start:render
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lendsqr-wallet-db
          property: connectionString
      - key: DB_SSL
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN_SECONDS
        value: "900"
      - key: CORS_ORIGINS
        value: "*"
      - key: RATE_LIMIT_TTL_MS
        value: "60000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "100"
      - key: BLACKLIST_PROVIDER
        value: adjutor
      - key: ADJUTOR_BASE_URL
        value: https://adjutor.lendsqr.com
      - key: ADJUTOR_API_KEY
        sync: false
      - key: ADJUTOR_TIMEOUT_MS
        value: "5000"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_FIRST_NAME
        value: System
      - key: ADMIN_LAST_NAME
        value: Administrator
      - key: ADMIN_INITIAL_BALANCE_MINOR
        value: "0"

databases:
  - name: lendsqr-wallet-db
    plan: free
    databaseName: lendsqr_wallet
    user: lendsqr_wallet
    ipAllowList: []
