name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lendsqr_wallet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lendsqr_wallet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test --runInBand

      - name: Build
        run: pnpm build

      - name: Run database-backed tests
        run: pnpm test:e2e --runInBand
        env:
          NODE_ENV: test
          PORT: 3001
          CORS_ORIGINS: "*"
          RATE_LIMIT_TTL_MS: 60000
          RATE_LIMIT_MAX_REQUESTS: 100
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lendsqr_wallet_test
          DB_SSL: "false"
          JWT_SECRET: test-only-secret-that-is-longer-than-thirty-two-characters
          JWT_EXPIRES_IN_SECONDS: 900
          BLACKLIST_PROVIDER: test
          BLACKLIST_TEST_IDENTITIES: blocked@example.com,+2348000000000
